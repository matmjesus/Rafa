<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: O Legado dos Sumérios</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4ece1;
            color: #3e2723;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 8px solid #d4a373;
        }
        h1 {
            color: #8b5e3c;
            text-align: center;
            border-bottom: 2px dashed #d4a373;
            padding-bottom: 10px;
        }
        .intro {
            font-style: italic;
            text-align: center;
            margin-bottom: 25px;
        }
        .question {
            margin-bottom: 20px;
            padding: 15px;
            background: #faf7f2;
            border-left: 5px solid #d4a373;
            border-radius: 4px;
        }
        .question p {
            font-weight: bold;
            margin-top: 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-check {
            background-color: #8b5e3c;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 30px auto;
            transition: background 0.3s;
        }
        .btn-check:hover {
            background-color: #5d3e29;
        }
        .feedback {
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        #result-area {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏺 Desafio Sumério: O Berço da Civilização</h1>
    <p class="intro">Olá, jovem historiador! Responda às perguntas abaixo e clique no botão ao final para ver sua pontuação. Lembre-se: os escribas sumérios levavam anos para aprender, então não tenha pressa!</p>

    <div id="quiz">
        </div>

    <button class="btn-check" onclick="checkQuiz()">Finalizar e Corrigir</button>
    <div id="result-area"></div>
</div>

<script>
    // Aqui estão as nossas perguntas da aula!
    const questions = [
        { q: "Em qual região do mundo viviam os sumérios?", a: "mesopotamia" },
        { q: "Quais são os dois rios principais que banhavam a Mesopotâmia?", a: "tigre e eufrates" },
        { q: "Como se chamava a escrita feita com sinais em forma de cunha?", a: "cuneiforme" },
        { q: "Qual o nome das torres em formato de pirâmide (templos)?", a: "zigurate" },
        { q: "Os sumérios acreditavam em vários deuses. Eles eram...", a: "politeistas" },
        { q: "Qual invenção suméria revolucionou o transporte?", a: "roda" },
        { q: "Como se chamavam as cidades com governo próprio?", a: "cidades-estado" },
        { q: "Material usado para escrever (tabletes de...)", a: "argila" },
        { q: "A obra literária mais antiga é o 'Epos de...'", a: "gilgamesh" },
        { q: "Sistema matemático baseado em qual número?", a: "60" },
        { q: "Principal atividade econômica suméria?", a: "agricultura" },
        { q: "Canais usados para levar água às plantações:", a: "irrigacao" },
        { q: "O título do governante que era rei e sacerdote:", a: "patesi" },
        { q: "Verdadeiro ou Falso: Os sumérios inventaram a cerveja.", a: "verdadeiro" },
        { q: "Nome de uma das cidades mais antigas da Suméria:", a: "uruk" },
        { q: "O círculo foi dividido por eles em quantos graus?", a: "360" },
        { q: "Profissional responsável por registrar as leis e impostos:", a: "escriba" },
        { q: "Objeto usado para 'assinar' documentos na argila:", a: "selo cilindrico" },
        { q: "Os deuses eram considerados dóceis ou vingativos?", a: "vingativos" },
        { q: "Metal criado pela mistura de cobre e estanho:", a: "bronze" }
    ];

    const quizContainer = document.getElementById('quiz');

    // Colocando as perguntas na tela
    questions.forEach((item, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        qDiv.innerHTML = `
            <p>${index + 1}. ${item.q}</p>
            <input type="text" id="q${index}" placeholder="Sua resposta (sem acentos)...">
            <div id="f${index}" class="feedback"></div>
        `;
        quizContainer.appendChild(qDiv);
    });

    // Função que corrige o quiz
    function checkQuiz() {
        let score = 0;
        questions.forEach((item, index) => {
            // Pega o que o aluno digitou e tira letras maiúsculas e espaços extras
            let userAns = document.getElementById(`q${index}`).value.toLowerCase().trim();
            // Remove acentos para facilitar a correção
            userAns = userAns.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
            
            const feedback = document.getElementById(`f${index}`);
            
            // Verificação simples
            if (userAns.includes(item.a) || (item.a.includes(userAns) && userAns.length > 2)) {
                score++;
                feedback.innerHTML = "Correto! ✔️";
                feedback.className = "feedback correct";
            } else {
                feedback.innerHTML = "Errado. Resposta esperada: " + item.a;
                feedback.className = "feedback wrong";
            }
            feedback.style.display = "block";
        });

        const resultArea = document.getElementById('result-area');
        resultArea.style.display = "block";
        resultArea.innerHTML = `Sua pontuação final: ${score} de ${questions.length}`;
        
        if (score >= 15) {
            resultArea.style.backgroundColor = "#d4edda";
            resultArea.style.color = "#155724";
            resultArea.innerHTML += "<br>Incrível! Você é um mestre da Mesopotâmia!";
        } else {
            resultArea.style.backgroundColor = "#fff3cd";
            resultArea.style.color = "#856404";
            resultArea.innerHTML += "<br>Bom esforço! Que tal revisar as tábuas de argila?";
        }
        
        // Rola a tela para o final para mostrar o resultado
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
