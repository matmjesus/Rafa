<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: O Legado dos Sumérios (Múltipla Escolha)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4ece1;
            color: #3e2723;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 8px solid #d4a373;
        }
        h1 {
            color: #8b5e3c;
            text-align: center;
            border-bottom: 2px dashed #d4a373;
            padding-bottom: 10px;
        }
        .intro {
            font-style: italic;
            text-align: center;
            margin-bottom: 25px;
        }
        .question {
            margin-bottom: 25px;
            padding: 20px;
            background: #faf7f2;
            border-left: 5px solid #d4a373;
            border-radius: 8px;
        }
        .question p {
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            background: #fff;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }
        .option-label:hover {
            background: #f0e6d2;
        }
        .option-label input {
            margin-right: 10px;
            cursor: pointer;
        }
        .btn-check {
            background-color: #8b5e3c;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin: 30px auto;
            transition: background 0.3s;
        }
        .btn-check:hover {
            background-color: #5d3e29;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .correct-bg { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .wrong-bg { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        
        #result-area {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏺 Desafio Sumério: Múltipla Escolha</h1>
    <p class="intro">Atenção, turma! Leiam com cuidado as opções. Marquem a resposta correta e cliquem em "Finalizar e Corrigir" no final da página para verem como se saíram.</p>

    <div id="quiz">
        </div>

    <button class="btn-check" onclick="checkQuiz()">Finalizar e Corrigir</button>
    <div id="result-area"></div>
</div>

<script>
    // Nossas 20 perguntas reformuladas com alternativas!
    const questions = [
        { 
            q: "Em qual região do mundo viviam os sumérios?", 
            options: ["Egito", "Mesopotâmia", "Grécia", "Roma"], 
            answer: 1 
        },
        { 
            q: "Quais são os dois rios principais que banhavam a Mesopotâmia?", 
            options: ["Nilo e Jordão", "Amazonas e São Francisco", "Tigre e Eufrates", "Ganges e Indo"], 
            answer: 2 
        },
        { 
            q: "Como se chamava a escrita criada pelos sumérios, feita com sinais em forma de cunha?", 
            options: ["Hieróglifos", "Alfabeto Latino", "Ideogramas", "Escrita Cuneiforme"], 
            answer: 3 
        },
        { 
            q: "Qual era o nome das grandes torres em formato de pirâmide que serviam como templos?", 
            options: ["Zigurates", "Obeliscos", "Panteões", "Mastabas"], 
            answer: 0 
        },
        { 
            q: "Os sumérios eram monoteístas (um deus) ou politeístas (vários deuses)?", 
            options: ["Monoteístas", "Ateus", "Politeístas", "Animistas"], 
            answer: 2 
        },
        { 
            q: "Qual invenção suméria revolucionou o transporte e a cerâmica?", 
            options: ["A Bússola", "A Roda", "A Pólvora", "O Papel"], 
            answer: 1 
        },
        { 
            q: "Como se chamavam as cidades sumérias que tinham governo e leis próprias?", 
            options: ["Cidades-Estado", "Feudos", "Capitanias", "Impérios"], 
            answer: 0 
        },
        { 
            q: "Qual era o material usado pelos sumérios para escrever seus registros?", 
            options: ["Papiro", "Folhas de palmeira", "Pergaminho (pele de animal)", "Tábuas de argila úmida"], 
            answer: 3 
        },
        { 
            q: "O 'Epos de Gilgamesh' é considerado uma das obras mais antigas de qual gênero?", 
            options: ["Literatura (Epopeia)", "Matemática", "Medicina", "Astronomia"], 
            answer: 0 
        },
        { 
            q: "Os sumérios desenvolveram um sistema matemático baseado em qual número?", 
            options: ["Base 10", "Base 12", "Base 60", "Base 100"], 
            answer: 2 
        },
        { 
            q: "Qual era a principal atividade econômica dos sumérios?", 
            options: ["Comércio Marítimo", "Agricultura", "Mineração", "Caça"], 
            answer: 1 
        },
        { 
            q: "Como os sumérios levavam água dos rios para as plantações em épocas de seca?", 
            options: ["Caminhões-pipa", "Canais de irrigação", "Aquedutos de pedra", "Poços artesianos profundos"], 
            answer: 1 
        },
        { 
            q: "Quem era a figura no topo da pirâmide social suméria, que era chefe militar e religioso?", 
            options: ["O Patesi", "O Faraó", "O Imperador", "O Presidente"], 
            answer: 0 
        },
        { 
            q: "Verdadeiro ou Falso: Os sumérios são creditados pela invenção de uma bebida muito famosa hoje, a cerveja.", 
            options: ["Falso", "Verdadeiro"], 
            answer: 1 
        },
        { 
            q: "Qual destas cidades é considerada uma das mais importantes e antigas da Suméria?", 
            options: ["Atenas", "Esparta", "Uruk", "Cartago"], 
            answer: 2 
        },
        { 
            q: "Os sumérios dividiram o círculo em quantos graus?", 
            options: ["100 graus", "180 graus", "360 graus", "400 graus"], 
            answer: 2 
        },
        { 
            q: "Qual era a função principal dos escribas na sociedade suméria?", 
            options: ["Construir casas", "Lutar nas guerras", "Registrar impostos, leis e estoques", "Plantar trigo"], 
            answer: 2 
        },
        { 
            q: "Para que serviam os selos cilíndricos usados por esse povo?", 
            options: ["Assinar documentos e marcar propriedades", "Moer grãos", "Decorar roupas", "Medir o tempo"], 
            answer: 0 
        },
        { 
            q: "Os sumérios acreditavam que os deuses eram:", 
            options: ["Sempre bondosos", "Imprevisíveis e vingativos", "Indiferentes aos humanos", "Dóceis e calmos"], 
            answer: 1 
        },
        { 
            q: "Qual metal os sumérios aprenderam a manipular para criar ferramentas mais resistentes?", 
            options: ["Ferro", "Aço", "Ouro", "Bronze (mistura de cobre com estanho)"], 
            answer: 3 
        }
    ];

    const quizContainer = document.getElementById('quiz');

    // Gerando o HTML das perguntas
    questions.forEach((item, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        
        let optionsHtml = '';
        item.options.forEach((opt, optIndex) => {
            optionsHtml += `
                <label class="option-label" id="label-q${index}-o${optIndex}">
                    <input type="radio" name="q${index}" value="${optIndex}">
                    ${opt}
                </label>
            `;
        });

        qDiv.innerHTML = `
            <p>${index + 1}. ${item.q}</p>
            <div class="options">
                ${optionsHtml}
            </div>
            <div id="f${index}" class="feedback"></div>
        `;
        quizContainer.appendChild(qDiv);
    });

    // Função de correção
    function checkQuiz() {
        let score = 0;

        questions.forEach((item, index) => {
            const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
            const feedbackDiv = document.getElementById(`f${index}`);
            
            // Pega todos os labels dessa pergunta para limpar a formatação
            const labels = document.querySelectorAll(`input[name="q${index}"]`);
            labels.forEach(radio => {
                radio.parentElement.style.backgroundColor = "#fff";
                radio.parentElement.style.borderColor = "#ddd";
            });

            if (selectedOption) {
                const answerValue = parseInt(selectedOption.value);
                const correctLabel = document.getElementById(`label-q${index}-o${item.answer}`);
                
                if (answerValue === item.answer) {
                    score++;
                    feedbackDiv.innerHTML = "✅ Resposta Certa!";
                    feedbackDiv.className = "feedback correct-bg";
                    feedbackDiv.style.color = "#155724";
                    correctLabel.style.backgroundColor = "#d4edda";
                    correctLabel.style.borderColor = "#28a745";
                } else {
                    const selectedLabel = document.getElementById(`label-q${index}-o${answerValue}`);
                    feedbackDiv.innerHTML = `❌ Errado. A resposta correta era: <strong>${item.options[item.answer]}</strong>`;
                    feedbackDiv.className = "feedback wrong-bg";
                    feedbackDiv.style.color = "#721c24";
                    selectedLabel.style.backgroundColor = "#f8d7da";
                    selectedLabel.style.borderColor = "#dc3545";
                    correctLabel.style.backgroundColor = "#d4edda";
                    correctLabel.style.borderColor = "#28a745";
                }
            } else {
                feedbackDiv.innerHTML = "⚠️ Você esqueceu de responder esta!";
                feedbackDiv.className = "feedback wrong-bg";
                feedbackDiv.style.color = "#856404";
                feedbackDiv.style.backgroundColor = "#fff3cd";
                feedbackDiv.style.borderColor = "#ffeeba";
                
                // Destaca a correta mesmo se não respondeu
                const correctLabel = document.getElementById(`label-q${index}-o${item.answer}`);
                correctLabel.style.backgroundColor = "#d4edda";
                correctLabel.style.borderColor = "#28a745";
            }
            feedbackDiv.style.display = "block";
        });

        const resultArea = document.getElementById('result-area');
        resultArea.style.display = "block";
        resultArea.innerHTML = `Sua pontuação final: ${score} de ${questions.length}`;
        
        if (score >= 15) {
            resultArea.style.backgroundColor = "#d4edda";
            resultArea.style.color = "#155724";
            resultArea.innerHTML += "<br>Incrível! Você é um mestre da Mesopotâmia!";
        } else if (score >= 10) {
            resultArea.style.backgroundColor = "#d1ecf1";
            resultArea.style.color = "#0c5460";
            resultArea.innerHTML += "<br>Bom trabalho! Só falta revisar mais alguns pergaminhos.";
        } else {
            resultArea.style.backgroundColor = "#fff3cd";
            resultArea.style.color = "#856404";
            resultArea.innerHTML += "<br>Não desanime! A História se constrói com muito estudo. Revise a matéria e tente de novo!";
        }
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
